<!-- fontawesome -->
<script defer src="{{ (printf "%sfontawesome-6/all-6.4.2.js" (.Site.Params.staticPath | default "")) | relURL }}"></script>

<!-- Uniform "View All" button style across all sections -->
<style>
  .btn-view-all {
    background-color: transparent !important;
    border: 2px solid {{ .Site.Params.color.primaryColor | default "#cc0000" }};
    color: {{ .Site.Params.color.primaryColor | default "#cc0000" }} !important;
    font-weight: 600;
    padding: 0.55rem 1.8rem;
    border-radius: 30px;
    transition: all 0.25s ease;
    text-decoration: none !important;
    display: inline-block;
  }
  .btn-view-all:hover {
    background-color: {{ .Site.Params.color.primaryColor | default "#cc0000" }} !important;
    border-color: {{ .Site.Params.color.primaryColor | default "#cc0000" }};
    color: #ffffff !important;
    box-shadow: 0 4px 14px rgba(204, 0, 0, 0.3);
    transform: scale(1.02);
  }
  /* Fix: header z-index is 10 in theme, same as gallery badges — raise it above all page content */
  #profileHeader {
    z-index: 1000 !important;
  }
</style>

<!-- Smooth scroll for all in-page anchor links -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('a[href^="#"]').forEach(function (anchor) {
      anchor.addEventListener('click', function (e) {
        var targetId = this.getAttribute('href').slice(1);
        if (!targetId) return;
        var target = document.getElementById(targetId);
        if (target) {
          e.preventDefault();
          target.scrollIntoView({ behavior: 'smooth', block: 'start' });
          // Update URL hash without reload
          history.pushState(null, null, '#' + targetId);
        }
      });
    });
  });
</script>
