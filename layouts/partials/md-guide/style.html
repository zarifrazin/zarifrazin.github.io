{{- /* Shared styles for the MD guide landing page and its chapters */ -}}
<style>
  .guide-crumbs {
    font-size: 0.85rem;
    opacity: 0.75;
    margin-bottom: 1rem;
  }
  .guide-crumbs a {
    color: inherit !important;
    text-decoration: none;
  }
  .guide-crumbs a:hover {
    color: var(--primary-color) !important;
  }
  .guide-kicker {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--primary-color) !important;
    margin-bottom: 0.5rem;
  }

  /* Chapter list: landing-page roadmap and chapter sidebar */
  .guide-chapters {
    list-style: none;
    padding-left: 0 !important;
    margin: 0;
    counter-reset: chapter;
  }
  .guide-chapters li {
    margin: 0 !important;
  }
  .guide-chapters a {
    display: flex;
    gap: 0.75rem;
    align-items: baseline;
    padding: 0.45rem 0.75rem;
    border-radius: 6px;
    color: inherit !important;
    text-decoration: none !important;
    font-size: 0.92rem;
    line-height: 1.4;
  }
  .guide-chapters a::after {
    display: none;
  }
  .guide-chapters a:hover {
    background-color: rgba(127, 127, 127, 0.1);
  }
  .guide-chapters a.active {
    background-color: rgba(204, 0, 0, 0.08);
    color: var(--primary-color) !important;
    font-weight: 600;
  }
  .guide-chapters .num {
    font-variant-numeric: tabular-nums;
    opacity: 0.6;
    min-width: 1.2rem;
  }
  #single aside.guide-aside {
    background: transparent !important;
    box-shadow: none !important;
    padding: 0 !important;
  }
  .guide-sidebar {
    position: sticky;
    top: 6rem;
    font-size: 0.92rem;
  }
  .guide-sidebar h6, .guide-mobile-toc summary {
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    font-weight: 600;
    opacity: 0.7;
  }
  .guide-mobile-toc {
    border: 1px solid rgba(127, 127, 127, 0.25);
    border-radius: 8px;
    padding: 0.6rem 0.9rem;
    margin-bottom: 1.5rem;
  }
  .guide-mobile-toc summary {
    cursor: pointer;
  }

  /* Roadmap cards on the landing page */
  .guide-roadmap {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1rem;
    margin: 1.5rem 0 2.5rem;
  }
  #single .page-content .guide-roadmap a {
    display: block;
    padding: 1rem 1.1rem;
    border: 1px solid rgba(127, 127, 127, 0.25);
    border-radius: 8px;
    color: var(--text-color) !important;
    text-decoration: none !important;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
  }
  #single .page-content .guide-roadmap a::after {
    display: none;
  }
  #single .page-content .guide-roadmap a:hover {
    transform: translateY(-3px);
    border-color: var(--primary-color);
    box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.08);
  }
  .guide-roadmap .num {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--primary-color) !important;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .guide-roadmap .t {
    display: block;
    font-weight: 600;
    margin: 0.2rem 0 0.35rem;
    font-size: 1.02rem;
  }
  .guide-roadmap .s {
    display: block;
    font-size: 0.88rem;
    line-height: 1.5;
    opacity: 0.8;
  }

  /* "New in this chapter" box */
  .guide-learn {
    border-left: 3px solid var(--primary-color);
    background-color: rgba(127, 127, 127, 0.07);
    border-radius: 0 8px 8px 0;
    padding: 0.9rem 1.2rem;
    margin: 0 0 2rem;
    font-size: 0.98rem;
  }
  .guide-learn > strong {
    display: block;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    margin-bottom: 0.35rem;
  }
  .guide-learn ul {
    margin: 0;
    padding-left: 1.2rem;
  }

  /* Figures and diagrams */
  #single .page-content figure {
    margin: 1.75rem 0;
    text-align: center;
  }
  #single .page-content figure img {
    max-width: 100%;
    border-radius: 8px;
  }
  #single .page-content figure svg {
    max-width: 100%;
    height: auto;
    color: var(--text-color);
  }
  #single .page-content figcaption {
    font-size: 0.88rem;
    opacity: 0.75;
    margin-top: 0.5rem;
    line-height: 1.5;
  }
  .guide-fig-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1rem;
    align-items: end;
  }

  /* Script files rendered from static/ */
  .guide-file {
    border: 1px solid rgba(127, 127, 127, 0.25);
    border-radius: 8px;
    margin: 1.25rem 0;
    overflow: hidden;
  }
  .guide-file > summary {
    cursor: pointer;
    padding: 0.65rem 1rem;
    font-weight: 600;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    list-style: none;
  }
  .guide-file > summary::-webkit-details-marker {
    display: none;
  }
  .guide-file > summary .gf-toggle {
    margin-left: auto;
    font-size: 0.8rem;
    font-weight: 500;
    opacity: 0.7;
  }
  .guide-file[open] > summary .gf-toggle::after {
    content: "Hide";
  }
  .guide-file:not([open]) > summary .gf-toggle::after {
    content: "Show";
  }
  #single .page-content .guide-file pre {
    margin: 0;
    border-radius: 0;
    max-height: 32rem;
  }
  .guide-file .gf-actions {
    padding: 0.5rem 1rem;
    font-size: 0.88rem;
    border-top: 1px solid rgba(127, 127, 127, 0.2);
  }

  /* Previous / next */
  .guide-pager {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin: 3rem 0 1rem;
  }
  .guide-pager a {
    display: block;
    padding: 0.9rem 1.1rem;
    border: 1px solid rgba(127, 127, 127, 0.25);
    border-radius: 8px;
    color: inherit !important;
    text-decoration: none !important;
    transition: border-color 0.2s ease;
  }
  .guide-pager a:hover {
    border-color: var(--primary-color);
  }
  .guide-pager .next {
    text-align: right;
    grid-column: 2;
  }
  .guide-pager small {
    display: block;
    font-size: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    opacity: 0.65;
  }
  .guide-pager span {
    font-weight: 600;
  }
  @media (max-width: 575px) {
    .guide-pager {
      grid-template-columns: 1fr;
    }
    .guide-pager .next {
      grid-column: 1;
    }
  }
</style>
