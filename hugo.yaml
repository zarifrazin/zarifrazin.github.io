baseURL: https://abzarif.com/
locale: en-us
title: "AB Zarif Razin"
theme: "hugo-profile"

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true

#services:
  #googleAnalytics:
    #id: G-MEASUREMENT_ID
  #disqus:
    #shortname: your-disqus-shortname

pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      # Leave $...$ / $$...$$ untouched so Markdown doesn't mangle math (e.g. _ in subscripts)
      passthrough:
        enable: true
        delimiters:
          inline:
            - ['$', '$']
            - ['\(', '\)']
          block:
            - ['$$', '$$']
            - ['\[', '\]']

Menus:
  # params.section: the section under params below; its tab hides when that section has enable: false
  main:
    - name: "About"
      url: "/#about"
      weight: 5
      params:
        section: about
    - name: "Publications"
      url: "/#publications"
      weight: 10
      params:
        section: publications
    - name: "Projects"
      url: "/#projects"
      weight: 15
      params:
        section: projects
    - name: "Experience"
      url: "/#experience"
      weight: 20
      params:
        section: experience
    - name: "Education"
      url: "/#education"
      weight: 25
      params:
        section: education
    - name: "Honors & Activities"
      url: "/#achievements"
      weight: 30
      params:
        section: achievements
    - name: "Resources"
      url: "/#resources"
      weight: 35
      params:
        section: resources
    - name: "Life Events"
      url: "/#life-events"
      weight: 40
      params:
        section: timeline
    - name: "Gallery"
      url: "/#gallery"
      weight: 45
      params:
        section: gallery
    - name: "Wandering Thoughts"
      url: "/#wandering-thoughts"
      weight: 50
      params:
        section: wandering_thoughts

params:
  # Home-page sections (all of them follow the same rule):
  #   - every post with featured: true is shown, however many there are
  #   - if fewer than `count` are featured, the newest other posts fill in up to `count`
  title: "Zarif Ahmad Razin Bhuiyan"
  # Search engines: shown as the home page title and the snippet under it in Google
  description: "Zarif Ahmad Razin Bhuiyan (AB Zarif Razin) is a PhD student and Graduate Research Assistant in Mechanical Engineering at NC State University, studying nanoscale thermal transport with molecular dynamics."
  seo:
    homeTitle: "Zarif Ahmad Razin Bhuiyan | PhD Researcher, NC State University"
  # Default preview image when a page is shared or shown in search
  images:
    - "/images/profile.jpg"
  favicon: "/fav.png"

  # Whether the fade animations on the home page will be enabled
  animate: true

  theme:
    disableThemeToggle: true
    defaultTheme: "light" # light or dark

  font:
    fontSize: 1rem
    fontWeight: 400
    lineHeight: 1.5
    textAlign: left

  # Premium Color Palette (NC State Red & Slate Gray Theme)
  color:
    textColor: "#1e293b"            # slate-800
    secondaryTextColor: "#475569"   # slate-600
    textLinkColor: "#cc0000"        # NC State Red
    backgroundColor: "#f8fafc"      # slate-50
    secondaryBackgroundColor: "#f1f5f9" # slate-100
    primaryColor: "#cc0000"         # NC State Red
    secondaryColor: "#ffffff"

    darkmode:
      textColor: "#f1f5f9"          # slate-100
      secondaryTextColor: "#94a3b8" # slate-400
      textLinkColor: "#ff4d4d"      # bright red accent
      backgroundColor: "#0f172a"    # slate-900
      secondaryBackgroundColor: "#1e293b" # slate-800
      primaryColor: "#ff4d4d"
      secondaryColor: "#1e293b"

  navbar:
    align: ms-auto # Left: ms-auto | center: mx-auto | right: me-auto
    brandName: "AB Zarif Razin"
    showBrandLogo: false
    disableSearch: true
    stickyNavBar:
      enable : true
      showOnScrollUp : false
    enableSeparator: false
    menus:
      disableAbout: true
      disableExperience: true
      disableEducation: true
      disableProjects: true
      disableAchievements: true
      disableContact: true

  # Hero Section
  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Zarif Ahmad Razin Bhuiyan"
    subtitle: "Mechanical Engineer and Researcher"
    content: "Hi, I'm Zarif. I am a Graduate Research Assistant and PhD student in the Department of Mechanical and Aerospace Engineering at North Carolina State University. I conduct research on nano-scale thermal transport using Molecular Dynamics simulations in Dr. Jun Liu's lab. Previously, I obtained my undergraduate degree from Bangladesh University of Engineering and Technology (BUET)."
    button:
      enable: true
      name: "Get in Touch"
      url: "#contact"
      download: false
      newPage: false
    image: "/images/profile.jpg"
    roundImage: true
    socialLinks:
      fontAwesomeIcons:
        - icon: fab fa-github
          url: "https://github.com/zarifrazin"
        - icon: fab fa-linkedin
          url: "https://www.linkedin.com/in/zarif-razin"
        - icon: fab fa-facebook
          url: "http://fb.com/zarif.razin"
        # From abzarif.com "Find Me"
        - icon: fas fa-graduation-cap
          url: "https://scholar.google.com/citations?user=HhNqllUAAAAJ&hl=en"
        - icon: fas fa-envelope
          url: "mailto:zrazinb@ncsu.edu"

  # About Section
  about:
    enable: true
    title: "About Me"
    content: |-
      Greetings and welcome to my personal website! I'm Zarif, a Mechanical Engineering researcher and educator. Though I was born in the Cumilla district, my childhood was spent in the village of Kalipur in the Chandpur district, situated on the tranquil banks of the magnificent Meghna River.

      I completed my Bachelor's degree in Mechanical Engineering from Bangladesh University of Engineering and Technology (BUET) in May 2022, and I am currently pursuing a PhD in Mechanical Engineering at NC State University (NCSU) in the USA. Before joining NCSU, I served as a Lecturer at Sonargaon University (SU) and a Teaching Assistant (TA) at BUET.

      Through this website, I hope to share my journey, insights, and experiences with you as we explore new frontiers and learn from one another.
    skills:
      enable: false
      title: "Here are a few areas and technologies I work with:"
      items:
        - "Molecular Dynamics (MD) / LAMMPS"
        - "Finite Element Analysis (FEA) / ANSYS"
        - "Computational Fluid Dynamics (CFD)"
        - "MATLAB & Python Programming"
        - "CAD Modeling & 3D Printing"
        - "Heat Transfer Equipment Design"

  # Experience Section
  experience:
    enable: true
    title: "Experience"
    path: "experience"
    count: 3

  # Education Section
  education:
    enable: true
    title: "Education"
    subtitle: "I have pursued my passion for learning and honing my skills through a strong educational foundation. Here is a glimpse of my educational background:"
    path: "education"
    count: 2

  # Projects Section
  projects:
    enable: true
    title: "Research & Projects"
    path: "projects"
    count: 3
    categories:
      - "Research"
      - "Engineering"

  # Timeline (Life Events) Section
  timeline:
    enable: true
    title: "Life Events"
    path: "life-events"
    count: 3
    disableFeaturedImage: false

  # Publications Section
  publications:
    enable: true
    title: "Publications"
    path: "publications"
    count: 3

  # Resources Section
  resources:
    enable: true
    title: "Research Resources"
    path: "resources"
    count: 3
    categories:
      - "Simulation Scripts"
      - "Tutorials & Guides"
      - "Handouts & PDFs"
      - "Skills Showcase"

  # Gallery Section
  gallery:
    enable: true
    title: "Photo Gallery"
    subtitle: "Glimpses from my conferences, research, and travels"
    path: "gallery"

  # Achievements / Honors & Activities Section
  achievements:
    enable: true
    title: "Honors & Activities"
    path: "honors-activities"
    count: 3

  # Wandering Thoughts (Casual Blog) Section
  wandering_thoughts:
    enable: false
    title: "Wandering Thoughts"
    subtitle: "Reflections, logs, and stories beyond the academic desk"
    path: "wandering-thoughts"
    count: 3

  # File previews ({{< preview src="..." >}} in any .md file)
  # open: true = previews start expanded; false = visitors click "Show preview".
  # A page can override this with `preview_open: true/false` in its front matter.
  preview:
    open: false

  # Contact Section
  contact:
    enable: true
    title: "Contact"
    content: "My inbox is always open! Feel free to reach out if you have questions, want to collaborate on research, or just want to say hello.<br>✉️ [zrazinb@ncsu.edu](mailto:zrazinb@ncsu.edu) · ✉️ [abzarifrazin@gmail.com](mailto:abzarifrazin@gmail.com)"
    btnName: "Send Email"
    btnLink: "mailto:zrazinb@ncsu.edu"
