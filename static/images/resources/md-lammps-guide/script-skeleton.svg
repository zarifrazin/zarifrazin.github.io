<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 440" width="560" height="440" role="img" aria-label="The seven stages shared by every input script in this guide" font-family="system-ui, -apple-system, Segoe UI, sans-serif"><title>The seven stages shared by every input script in this guide</title><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#cc0000"/></marker><marker id="ark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs><rect x="20" y="10" width="520" height="46" rx="8" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="36" y="30" font-size="15" font-weight="600" fill="currentColor">1. Initialization</text><text x="36" y="48" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="currentColor" opacity="0.75">units, dimension, boundary, atom_style</text><line x1="280.0" y1="56" x2="280.0" y2="69" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#ark)"/><rect x="20" y="70" width="520" height="46" rx="8" fill="#cc0000" fill-opacity="0.08" stroke="#cc0000" stroke-opacity="1" stroke-width="2"/><text x="36" y="90" font-size="15" font-weight="600" fill="currentColor">2. Build the structure</text><text x="36" y="108" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="currentColor" opacity="0.75">lattice + region + create_atoms, or read_data</text><text x="526" y="98" text-anchor="end" font-size="12" font-weight="600" fill="#cc0000">changes per system</text><line x1="280.0" y1="116" x2="280.0" y2="129" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#ark)"/><rect x="20" y="130" width="520" height="46" rx="8" fill="#cc0000" fill-opacity="0.08" stroke="#cc0000" stroke-opacity="1" stroke-width="2"/><text x="36" y="150" font-size="15" font-weight="600" fill="currentColor">3. Interatomic potential</text><text x="36" y="168" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="currentColor" opacity="0.75">pair_style, pair_coeff</text><text x="526" y="158" text-anchor="end" font-size="12" font-weight="600" fill="#cc0000">changes per system</text><line x1="280.0" y1="176" x2="280.0" y2="189" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#ark)"/><rect x="20" y="190" width="520" height="46" rx="8" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="36" y="210" font-size="15" font-weight="600" fill="currentColor">4. Settings</text><text x="36" y="228" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="currentColor" opacity="0.75">timestep, neighbor list</text><line x1="280.0" y1="236" x2="280.0" y2="249" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#ark)"/><rect x="20" y="250" width="520" height="46" rx="8" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="36" y="270" font-size="15" font-weight="600" fill="currentColor">5. Energy minimization</text><text x="36" y="288" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="currentColor" opacity="0.75">min_style, minimize</text><line x1="280.0" y1="296" x2="280.0" y2="309" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#ark)"/><rect x="20" y="310" width="520" height="46" rx="8" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="36" y="330" font-size="15" font-weight="600" fill="currentColor">6. Save a snapshot</text><text x="36" y="348" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="currentColor" opacity="0.75">write_data</text><line x1="280.0" y1="356" x2="280.0" y2="369" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.5" marker-end="url(#ark)"/><rect x="20" y="370" width="520" height="46" rx="8" fill="none" fill-opacity="0" stroke="currentColor" stroke-opacity="0.35" stroke-width="1.2"/><text x="36" y="390" font-size="15" font-weight="600" fill="currentColor">7. Equilibrate and record</text><text x="36" y="408" font-size="13" font-family="ui-monospace, Consolas, monospace" fill="currentColor" opacity="0.75">fix nvt, thermo, dump, run</text></svg>